name: publish-godel-artifacts
on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  run-godel-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Go toolchain
        id: go_version
        uses: palantir/github-actions/go-toolchain-setup@bc52d1d92f7e46161c59965962a7867f16ebd0b0 # 0.3.0
      - name: Export GOPATH
        shell: bash
        run: echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.GOPATH }}/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go_version.outputs.version }}-${{ hashFiles('**/go.sum') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.godel
          key: ${{ runner.os }}-godel-${{ hashFiles('godelw', 'godel/config/godel.yml') }}
      - run: ./godelw mod
      - run: ./godelw dist
      - run: ./godelw publish github --add-v-prefix --api-url=$GITHUB_API_URL --user=palantir --repository=godel --token=${{ secrets.GITHUB_TOKEN }}
